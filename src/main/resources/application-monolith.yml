# Configuration for monolithic deployment mode
app :
  deployment :
    mode : monolith
  monolith :
    enable-async-processing : true
    enable-event-driven-communication : true
    enable-modular-testing : true
    thread-pool-size : 10

# Local service configuration
services :
  user-management :
    url : http://localhost:8080
    local : true
  security :
    url : http://localhost:8080
    local : true
  notification :
    url : http://localhost:8080
    local : true
  analytics :
    url : http://localhost:8080
    local : true

# Database configuration for monolith
spring :
  datasource :
    # Single database for monolith
    url : jdbc:h2:mem:dashboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username : sa
    password :
    driver-class-name : org.h2.Driver
  
  h2 :
    console :
      enabled : true
      path : /h2-console
  
  jpa :
    hibernate :
      ddl-auto : create-drop
    show-sql : false
    properties :
      hibernate :
        format_sql : true
        dialect : org.hibernate.dialect.H2Dialect

# In-memory event processing for monolith
spring.modulith :
  events :
    # Enable event publication registry for testing
    publication-registry :
      enabled : true

# Actuator endpoints
management :
  endpoints :
    web :
      exposure :
        include : health,info,metrics,modulith
  endpoint :
    health :
      show-details : always
    modulith :
      enabled : true

# Logging configuration
logging :
  level :
    com.iqkv.sample.webmvc.dashboard : DEBUG
    org.springframework.modulith : DEBUG
    org.springframework.context.event : DEBUG
  pattern :
    console : "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
